<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test backendu konwertera</title>
<style>
  :root {
    --bg: #f3f4f6;
    --panel-bg: #ffffff;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --danger-hover: #dc2828;
    --radius: 8px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --panel-bg: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --accent: #3b82f6;
    }
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    max-width: 800px;
    margin: 0 auto;
    padding: 30px 20px;
    line-height: 1.5;
  }

  h2 { font-size: 1.75rem; margin-bottom: 0.5rem; }
  h3 { margin-top: 2rem; margin-bottom: 1rem; }

  .settings-row {
    background: var(--panel-bg);
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  fieldset {
    background: var(--panel-bg);
    margin: 24px 0;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: opacity 0.3s ease;
  }

  fieldset:disabled {
    opacity: 0.5;
    pointer-events: none;
    box-shadow: none;
  }

  legend {
    background: var(--accent);
    color: #ffffff;
    padding: 6px 16px;
    border-radius: 9999px;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.025em;
  }

  .input-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .input-group:last-of-type { margin-bottom: 0; }

  input, select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 6px;
    font: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  
  input:focus, select:focus {
    border-color: var(--accent);
  }
  
  input[type="file"] {
    background: transparent;
    border: none;
    padding: 0;
  }
  input[type="file"]::file-selector-button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 12px;
    transition: background 0.2s;
  }
  input[type="file"]::file-selector-button:hover { background: var(--border); }

  button {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
  }

  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }

  #who {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 14px;
    background: var(--bg);
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { padding: 12px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  tr:last-child td { border-bottom: none; }
  
  td button { padding: 6px 12px; font-size: 0.85rem; margin-right: 6px; }
  td button:last-child { background: var(--danger); }
  td button:last-child:hover { background: var(--danger-hover); }

  #log {
    background: #0f172a;
    color: #34d399;
    padding: 16px;
    height: 250px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    line-height: 1.4;
  }
</style>
</head>
<body>

<h2>Test backendu konwertera</h2>
<div class="settings-row">
  <label for="api" style="font-weight: 600;">Adres backendu:</label>
  <input id="api" value="http://localhost:8000" size="28" style="flex: 1; max-width: 300px; margin: 0;">
</div>

<fieldset>
  <legend>1. Logowanie</legend>
  <div class="input-group">
    <input id="email" type="email" placeholder="twoj@email.pl" size="28">
    <button id="btnOtp">Wyślij kod</button>
  </div>
  <div class="input-group">
    <input id="code" placeholder="kod (10 znaków)" size="18" maxlength="10">
    <button id="btnLogin">Zaloguj</button>
    <button id="btnLogout" style="background: var(--text-muted);">Wyloguj</button>
  </div>
  <div id="who">Niezalogowany</div>
</fieldset>

<fieldset id="convertBox" disabled>
  <legend>2. Konwersja</legend>
  <div class="input-group">
    <input id="file" type="file">
    <span style="font-weight: 500; color: var(--text-muted);">na</span>
    <select id="target">
      <option>jpg</option><option>png</option><option>gif</option><option>heic</option>
      <option>mp3</option><option>wav</option><option>flac</option>
      <option>mp4</option><option>mov</option>
    </select>
    <button id="btnConvert">Konwertuj</button>
  </div>
</fieldset>

<fieldset id="filesBox" disabled>
  <legend>3. Moje pliki (kasowane po 10 min)</legend>
  <button id="btnRefresh">Odśwież listę</button>
  <table><tbody id="files"></tbody></table>
</fieldset>

<h3>Log żądań sieciowych</h3>
<div id="log"></div>

<script>
// Sesja siedzi w cookie HttpOnly ustawianym przez backend. JavaScript nie widzi tokenu,
// więc nie ma czego trzymać w zmiennej. Przeglądarka sama dokleja cookie do żądań.
let loggedIn = false, sessionExp = 0, busy = false, refreshing = false;
const $ = (id) => document.getElementById(id);
const base = () => $("api").value.trim().replace(/\/$/, "");

function log(msg) {
  $("log").textContent += "[" + new Date().toLocaleTimeString() + "] " + msg + "\n";
  $("log").scrollTop = $("log").scrollHeight;
}

function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}

function setLoggedIn(on, expiresIn) {
  loggedIn = on;
  sessionExp = on ? Date.now() + expiresIn * 1000 : 0;
  $("convertBox").disabled = $("filesBox").disabled = !on;
  if (!on) { $("who").textContent = "Niezalogowany"; $("files").innerHTML = ""; }
}

// jedno miejsce, przez które idą wszystkie żądania; credentials:"include" = wysyłaj cookie
async function api(method, path, body, quiet) {
  const headers = {};
  if (body && !(body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(body);
  }
  try {
    const r = await fetch(base() + path, { method, headers, body, credentials: "include" });
    const text = await r.text();
    if (!quiet || r.ok) log(method + " " + path + " → " + r.status + " " + text);
    if (r.status === 401 && loggedIn) { log("Sesja wygasła"); setLoggedIn(false); }
    let data = null;
    try { data = JSON.parse(text); } catch (e) {}
    return { ok: r.ok, status: r.status, data };
  } catch (e) {
    log(method + " " + path + " → BŁĄD SIECI: " + e + "\n   (backend wyłączony, zły adres albo CORS: otwórz tę stronę przez http://localhost:3000)");
    return { ok: false, status: 0, data: null };
  }
}

// czy przeglądarka ma ważne cookie sesji? (też po odświeżeniu strony)
async function checkSession() {
  const r = await api("GET", "/auth/me", null, true);
  if (r.ok) { setLoggedIn(true, r.data.expires_in); refreshFiles(); }
}

$("btnOtp").onclick = async () => {
  const r = await api("POST", "/auth/request-otp", { email: $("email").value.trim() });
  if (r.ok) log("Kod wysłany. Sprawdź skrzynkę (także spam).");
};

$("btnLogin").onclick = async () => {
  const r = await api("POST", "/auth/verify-otp", {
    email: $("email").value.trim(),
    code: $("code").value.trim(),
  });
  if (r.ok) checkSession();   // odpowiedź nie zawiera tokenu, cookie jest już ustawione
};

$("btnLogout").onclick = async () => {
  await api("POST", "/auth/logout");
  setLoggedIn(false);
};

$("btnConvert").onclick = async () => {
  const file = $("file").files[0];
  if (!file) return log("Wybierz plik.");
  if (busy) return;
  busy = true; $("btnConvert").disabled = true;   // backend: jedna konwersja naraz na użytkownika
  const form = new FormData();
  form.append("file", file);
  form.append("target", $("target").value);
  const r = await api("POST", "/convert", form);
  busy = false; $("btnConvert").disabled = false;
  if (r.ok) refreshFiles();
};

$("btnRefresh").onclick = () => refreshFiles();

async function refreshFiles() {
  if (!loggedIn || refreshing) return;
  refreshing = true;
  const r = await api("GET", "/files");
  refreshing = false;
  if (!r.ok) return;
  const tb = $("files");
  tb.innerHTML = "";
  if (!r.data.length) { tb.innerHTML = "<tr><td colspan='4' style='text-align: center; color: var(--text-muted);'>Brak plików</td></tr>"; return; }
  for (const f of r.data) {
    const tr = document.createElement("tr");
    const cell = (text) => { const td = document.createElement("td"); td.textContent = text; tr.appendChild(td); return td; };
    cell(f.format.toUpperCase());
    cell(f.file_id.slice(0, 8) + "…");
    const ttl = cell(fmt(f.expires_in));
    ttl.dataset.exp = Date.now() + f.expires_in * 1000;   // odliczanie lokalne
    const act = cell("");
    const bDown = document.createElement("button");
    bDown.textContent = "Pobierz";
    bDown.onclick = () => download(f.file_id, f.format);
    const bDel = document.createElement("button");
    bDel.textContent = "Usuń";
    bDel.onclick = async () => { await api("DELETE", "/files/" + f.file_id); refreshFiles(); };
    act.append(bDown, bDel);
    tb.appendChild(tr);
  }
}

// fetch + blob działa niezależnie od tego, czy front i backend są w tej samej domenie
async function download(id, format) {
  const r = await fetch(base() + "/files/" + id, { credentials: "include" });
  log("GET /files/" + id + " → " + r.status);
  if (!r.ok) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(await r.blob());
  a.download = "converted." + format;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// co sekundę: odliczanie sesji i plików
setInterval(() => {
  if (loggedIn) {
    const left = (sessionExp - Date.now()) / 1000;
    $("who").innerHTML = "Zalogowany <span style='color: var(--text); font-weight: 600;'>·</span> sesja wygasa za " + fmt(left);
    if (left <= 0) { log("Sesja wygasła"); setLoggedIn(false); return; }
  }
  let expired = false;
  document.querySelectorAll("[data-exp]").forEach((el) => {
    const left = (el.dataset.exp - Date.now()) / 1000;
    el.textContent = fmt(left);
    if (left <= 0) expired = true;
  });
  if (expired) refreshFiles();
}, 1000);

checkSession();
</script>
</body>
</html>
