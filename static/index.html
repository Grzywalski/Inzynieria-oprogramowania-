<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konwerter plików</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">

  <!-- ===== EKRAN 1: LOGOWANIE (widoczne zawsze na start) ===== -->
  <section id="loginView" class="card">
    <h1>Konwerter plików</h1>
    <p class="sub">Zaloguj się kodem wysyłanym na e-mail, aby korzystać z konwertera.</p>

    <form id="stepEmail" autocomplete="on">
      <label for="email">Adres e-mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="email"
             placeholder="twoj@email.pl" required>
      <button type="submit" id="btnOtp" class="btn btn-primary">Wyślij kod</button>
    </form>

    <form id="stepCode" hidden>
      <p class="hint">Kod został wysłany na <b id="sentTo"></b>. Sprawdź też folder spam.</p>
      <label for="code">Kod z e-maila</label>
      <input id="code" maxlength="10" autocomplete="one-time-code"
             placeholder="kod (10 znaków)" required>
      <div class="row">
        <button type="submit" id="btnLogin" class="btn btn-primary">Zaloguj</button>
        <button type="button" id="btnBack" class="btn btn-ghost">Zmień e-mail</button>
      </div>
    </form>

    <p id="authMsg" class="msg" role="status"></p>
  </section>

  <!-- ===== EKRAN 2: APLIKACJA (ukryta do momentu zalogowania) ===== -->
  <section id="appView" hidden>

    <header class="topbar card">
      <span class="brand">Konwerter plików</span>
      <span class="grow"></span>
      <span id="who" class="who"></span>
      <button id="btnLogout" class="btn btn-ghost">Wyloguj</button>
    </header>

    <section class="card convert-card">
      <h2>Konwersja</h2>

      <div id="dropZone" class="dropzone" role="button" tabindex="0"
           aria-label="Przeciągnij plik tutaj lub kliknij, aby wybrać">
        <p class="dz-main">Przeciągnij plik tutaj</p>
        <p class="hint">albo kliknij, aby wybrać</p>
      </div>
      <input id="file" type="file" hidden>
      <p id="fileName" class="file-name" hidden></p>

      <p class="convert-label">Konwertuj na:</p>
      <div id="targetRow" class="pill-slider">
        <input id="target" type="hidden" value="jpg">
        <button type="button" class="pill active" data-target="jpg">jpg</button>
        <button type="button" class="pill" data-target="png">png</button>
        <button type="button" class="pill" data-target="gif">gif</button>
        <button type="button" class="pill" data-target="heic">heic</button>
        <button type="button" class="pill" data-target="mp3">mp3</button>
        <button type="button" class="pill" data-target="wav">wav</button>
        <button type="button" class="pill" data-target="flac">flac</button>
        <button type="button" class="pill" data-target="mp4">mp4</button>
        <button type="button" class="pill" data-target="mov">mov</button>
      </div>

      <button id="btnConvert" class="btn btn-primary convert-btn">Konwertuj</button>
      <p id="convMsg" class="msg" role="status"></p>
    </section>

    <section class="card">
      <div class="row">
        <h2>Moje pliki</h2>
        <span class="grow"></span>
        <button id="btnRefresh" class="btn btn-ghost">Odśwież</button>
      </div>
      <p class="hint">Pliki są usuwane po 10 minutach.</p>
      <table>
        <thead><tr><th>Format</th><th>Plik</th><th>Wygasa za</th><th></th></tr></thead>
        <tbody id="files"></tbody>
      </table>
      <p id="filesMsg" class="msg" role="status"></p>
    </section>

  </section>
</main>

<!-- Skrypt i style są w osobnych plikach, bo nagłówek CSP z backendu blokuje kod wpisany w HTML -->
<script src="app.js"></script>
</body>
</html>
